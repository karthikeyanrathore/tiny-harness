name: release

# Builds the Ubuntu packages and tests installing them; a v* tag also publishes them as a GitHub release.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['plugins/**', 'debian/**', 'scripts/**', 'src/**', 'package.json', '.github/workflows/release.yml']
  workflow_dispatch:

jobs:
  deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-deb.sh ${{ matrix.arch }}
      - name: Install test on Ubuntu 22.04
        run: docker run --rm -v "$PWD:/w" -w /w ubuntu:22.04 debian/test-install.sh dist/tiny-harness_*_${{ matrix.arch }}.deb dist/tiny-harness-calendar_*_all.deb
      - name: Install test on Ubuntu 24.04
        run: docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 debian/test-install.sh dist/tiny-harness_*_${{ matrix.arch }}.deb dist/tiny-harness-calendar_*_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
